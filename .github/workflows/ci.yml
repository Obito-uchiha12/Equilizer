name: Android CI (Development)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Environment & Wrapper
        run: |
          echo "=== CI Diagnostics ==="
          echo "Current Directory: $(pwd)"
          ls -la
          chmod +x ./gradlew
          test -f ./gradlew
          ./gradlew --version

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Verify CI APK
        id: locate_ci_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*" -name "*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: No valid APK found after build!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          mkdir -p ci-artifacts
          cp "$APK_PATH" ci-artifacts/Equilizer-debug.apk
          echo "artifact_path=ci-artifacts/Equilizer-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload CI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Equilizer-CI-APK
          path: ci-artifacts/Equilizer-debug.apk
          if-no-files-found: error
          retention-days: 14
