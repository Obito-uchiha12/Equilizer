name: Build and Publish Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: "Build & Release Production APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Environment & Wrapper Diagnostics
        run: |
          set -euo pipefail

          echo "=== Release Environment Diagnostics ==="
          echo "Current Working Directory: $(pwd)"
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          echo "Git Ref Name: ${{ github.ref_name }}"

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

      - name: Determine and Validate Release Tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          TAG="$(echo "$TAG" | xargs)"

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag cannot be empty."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.-]+)?$ ]]; then
            echo "ERROR: Invalid release tag '$TAG'."
            echo "Expected format such as v1.0.0 or v1.0.1-beta.1"
            exit 1
          fi

          echo "Validated Release Tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Restore Keystore from Secrets If Configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."

            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "No external release keystore secret configured."
            echo "Continuing with the project's standard release configuration."
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Verify assembleRelease Task
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for assembleRelease task..."

          if ! ./gradlew tasks --all --no-daemon | grep -qE '(^|[[:space:]])assembleRelease([[:space:]]|$)'; then
            echo "ERROR: assembleRelease task was not found."
            exit 1
          fi

          echo "assembleRelease task found."

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect Release APK Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Release APK Output ==="

          if [ ! -d "app/build/outputs/apk/release" ]; then
            echo "ERROR: Release APK output directory does not exist."
            echo "Available build outputs:"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          find app/build/outputs/apk/release \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            -print

      - name: Locate Verify and Package Release APK
        id: package_release
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="app/build/outputs/apk/release"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "ERROR: $RELEASE_DIR does not exist."
            exit 1
          fi

          mapfile -t APK_FILES < <(
            find "$RELEASE_DIR" \
              -maxdepth 2 \
              -type f \
              -name "*.apk" \
              -print |
              sort
          )

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "ERROR: No release APK was produced."
            echo "Complete output tree:"
            find app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi

          echo "Found ${#APK_FILES[@]} APK file(s):"
          printf '%s\n' "${APK_FILES[@]}"

          PRIMARY_APK=""

          for apk in "${APK_FILES[@]}"; do
            filename="$(basename "$apk")"

            if [ "$filename" = "app-release.apk" ]; then
              PRIMARY_APK="$apk"
              break
            fi
          done

          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK="${APK_FILES[0]}"
          fi

          if [ ! -f "$PRIMARY_APK" ]; then
            echo "ERROR: Selected APK does not exist:"
            echo "$PRIMARY_APK"
            exit 1
          fi

          if [ ! -s "$PRIMARY_APK" ]; then
            echo "ERROR: Selected APK is empty:"
            echo "$PRIMARY_APK"
            exit 1
          fi

          echo "Selected Release APK:"
          echo "$PRIMARY_APK"

          ls -lh "$PRIMARY_APK"

          ASSET_NAME="Equilizer-${RELEASE_TAG}.apk"
          CHECKSUM_NAME="${ASSET_NAME}.sha256"

          cp "$PRIMARY_APK" "$ASSET_NAME"

          if [ ! -s "$ASSET_NAME" ]; then
            echo "ERROR: Packaged APK is empty."
            exit 1
          fi

          sha256sum "$ASSET_NAME" | tee "$CHECKSUM_NAME"

          SHA256_HASH="$(awk '{print $1}' "$CHECKSUM_NAME")"

          echo "APK_ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET_NAME=$CHECKSUM_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$SHA256_HASH" >> "$GITHUB_ENV"

          echo "========================================"
          echo "Release APK prepared successfully"
          echo "APK: $ASSET_NAME"
          echo "Size: $(ls -lh "$ASSET_NAME" | awk '{print $5}')"
          echo "SHA256: $SHA256_HASH"
          echo "========================================"

      - name: Upload Release Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Equilizer-Release-${{ env.RELEASE_TAG }}"
          path: |
            ${{ env.APK_ASSET_NAME }}
            ${{ env.CHECKSUM_ASSET_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Publishing GitHub Release: $RELEASE_TAG"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then

            echo "Release already exists."
            echo "Uploading/replacing release assets..."

            gh release upload \
              "$RELEASE_TAG" \
              "$APK_ASSET_NAME" \
              "$CHECKSUM_ASSET_NAME" \
              --clobber

          else

            echo "Release does not exist."
            echo "Creating release for commit: $GITHUB_SHA"

            gh release create \
              "$RELEASE_TAG" \
              "$APK_ASSET_NAME" \
              "$CHECKSUM_ASSET_NAME" \
              --title "Equilizer $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest

          fi

      - name: Verify GitHub Release Assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying GitHub Release..."

          RELEASE_JSON="$(
            gh release view "$RELEASE_TAG" \
              --json tagName,isDraft,isPrerelease,assets,url
          )"

          echo "$RELEASE_JSON"

          ASSET_NAMES="$(
            echo "$RELEASE_JSON" |
              jq -r '.assets[].name'
          )"

          echo "Release assets:"
          echo "$ASSET_NAMES"

          if ! echo "$ASSET_NAMES" | grep -Fxq "$APK_ASSET_NAME"; then
            echo "ERROR: APK was NOT attached to the GitHub Release."
            echo "Expected: $APK_ASSET_NAME"
            exit 1
          fi

          if ! echo "$ASSET_NAMES" | grep -Fxq "$CHECKSUM_ASSET_NAME"; then
            echo "ERROR: SHA256 checksum was NOT attached to the GitHub Release."
            echo "Expected: $CHECKSUM_ASSET_NAME"
            exit 1
          fi

          RELEASE_URL="$(echo "$RELEASE_JSON" | jq -r '.url')"

          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"

          echo "========================================"
          echo "GitHub Release Asset Verification PASS"
          echo "Release: $RELEASE_URL"
          echo "APK: $APK_ASSET_NAME"
          echo "Checksum: $CHECKSUM_ASSET_NAME"
          echo "========================================"

      - name: Secure Cleanup of Temporary Signing Files
        if: always()
        shell: bash
        run: |
          if [ -f "app/release.keystore" ]; then
            shred -u app/release.keystore || rm -f app/release.keystore
          fi

      - name: Print Release Summary
        shell: bash
        run: |
          echo "=================================================="
          echo "GitHub Release Published and Verified Successfully"
          echo "=================================================="
          echo "Release Tag:     $RELEASE_TAG"
          echo "APK Asset:       $APK_ASSET_NAME"
          echo "APK Size:        $(ls -lh "$APK_ASSET_NAME" | awk '{print $5}')"
          echo "SHA256:          $RELEASE_SHA256"
          echo "Release URL:     $RELEASE_URL"
          echo "=================================================="
