name: Build and Publish Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Environment & Wrapper Diagnostics
        run: |
          echo "=== Release Environment Diagnostics ==="
          echo "Current Working Directory: $(pwd)"
          echo "Git Ref: ${{ github.ref }}"
          echo "Git Ref Name: ${{ github.ref_name }}"
          ls -la
          chmod +x ./gradlew
          test -f ./gradlew
          ./gradlew --version

      - name: Restore Keystore from Secrets (If Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No external release keystore secret configured; continuing with standard release build."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate, Verify, and Package Release Artifacts
        id: package_release
        run: |
          TAG="${{ github.ref_name }}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "Target Release Tag: $TAG"
          
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -path "*/build/outputs/apk/*" -name "*release*.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Release APK not found or empty!"
            exit 1
          fi
          echo "Found generated Release APK at: $APK_PATH"
          ls -lh "$APK_PATH"
          
          RELEASE_APK="Equilizer-${TAG}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          
          # Generate SHA-256 Checksum file
          sha256sum "$RELEASE_APK" > "${RELEASE_APK}.sha256"
          SHA256=$(awk '{print $1}' "${RELEASE_APK}.sha256")
          
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV
          echo "SHA256_FILE=${RELEASE_APK}.sha256" >> $GITHUB_ENV
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV
          echo "Generated APK: $RELEASE_APK (SHA-256: $SHA256)"

      - name: Secure Cleanup of Temporary Signing Files
        if: always()
        run: |
          if [ -f "app/release.keystore" ]; then
            shred -u app/release.keystore || rm -f app/release.keystore
          fi

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          name: Equilizer ${{ env.RELEASE_TAG }}
          tag_name: ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          files: |
            ${{ env.RELEASE_APK }}
            ${{ env.SHA256_FILE }}
          body: |
            ## Equilizer Production Release (${{ env.RELEASE_TAG }})
            
            A high-precision, privacy-focused audio equalizer application for Android.

            ### 🎧 Highlights
            * **Real 5-Band Equalizer**: Native Android AudioEffect processing with bi-quadratic peaking filters (60 Hz, 230 Hz, 910 Hz, 3.6 kHz, 14 kHz).
            * **Headroom & Clipping Protection**: Automatic dynamic pre-gain attenuation and manual headroom modes.
            * **Smart EQ Assistant**: Goal-oriented sound tailoring based on listening preferences and device acoustic profiles.
            * **Per-Device Audio Routing**: Automatic profile persistence for Bluetooth headphones, wired earphones, USB audio, and phone speakers.
            * **Instant A/B Mode & Calibration Tones**: Instant flat comparison and diagnostic sine/pink noise/sweep generator.
            * **100% Offline & Private**: Zero internet, zero microphone, and zero telemetry permissions.

            ### 📋 Package & Verification
            * **Application ID**: `com.aistudio.equalizer.fxarch`
            * **Target SDK**: `36` (Android 16) | **Min SDK**: `24` (Android 7.0+)
            * **Release Binary**: `${{ env.RELEASE_APK }}`
            * **SHA-256 Checksum**: `${{ env.SHA256 }}`

            ### ⚠️ Known Platform Notes
            * Actual hardware effect support is managed by the device's audio HAL. OEM systems (e.g. Samsung SoundAlive, Xiaomi Dirac) may enforce device-specific audio routing policies.
