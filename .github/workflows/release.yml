name: Build and Publish Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: "Build & Release Production APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Environment & Wrapper Diagnostics
        run: |
          set -euo pipefail

          echo "=== Release Environment Diagnostics ==="
          echo "Current Working Directory: $(pwd)"
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          echo "Git Ref Name: ${{ github.ref_name }}"

          test -f ./gradlew
          chmod +x ./gradlew

          ./gradlew --version

      - name: Determine and Validate Release Tag
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          TAG="$(echo "$TAG" | xargs)"

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag cannot be empty."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.-]+)?$ ]]; then
            echo "ERROR: Invalid release tag '$TAG'."
            echo "Expected format such as v1.0.0 or v1.0.1-beta.1"
            exit 1
          fi

          echo "Validated Release Tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Restore Keystore from Secrets If Configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."

            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

            echo "KEYSTORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          else
            echo "No external release keystore secret configured."
            echo "Continuing with the project's standard release configuration."
          fi

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Verify assembleRelease Task
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for assembleRelease task..."

          if ! ./gradlew tasks --all --no-daemon | grep -qE '(^|[[:space:]])assembleRelease([[:space:]]|$)'; then
            echo "ERROR: assembleRelease task was not found."
            exit 1
          fi

          echo "assembleRelease task found."

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Inspect Release APK Output
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Release APK Output ==="

          if [ ! -d "app/build/outputs/apk/release" ]; then
            echo "ERROR: Release APK output directory does not exist."
            echo "Available build outputs:"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi

          find app/build/outputs/apk/release \
            -maxdepth 2 \
            -type f \
            -name "*.apk" \
            -print

      - name: Locate, Validate, and Package Release APK
        id: package_release
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_DIR="app/build/outputs/apk"

          if [ ! -d "$SEARCH_DIR" ]; then
            echo "ERROR: Search directory '$SEARCH_DIR' does not exist."
            exit 1
          fi

          echo "Searching recursively for release APK candidates under $SEARCH_DIR..."

          # Discover candidate APK files, explicitly rejecting debug, test, androidTest, benchmark
          mapfile -t CANDIDATES < <(
            find "$SEARCH_DIR" -type f -name "*.apk" \
              ! -name "*debug*" \
              ! -name "*test*" \
              ! -name "*androidTest*" \
              ! -name "*benchmark*" |
              sort
          )

          echo "Discovered ${#CANDIDATES[@]} candidate APK file(s):"
          printf ' - %s\n' "${CANDIDATES[@]}"

          if [ "${#CANDIDATES[@]}" -eq 0 ]; then
            echo "ERROR: No release APK candidates found in $SEARCH_DIR!"
            echo "Available files in $SEARCH_DIR:"
            find "$SEARCH_DIR" -type f -maxdepth 5 -print || true
            exit 1
          fi

          # Deterministic selection:
          # Priority 1: app-release.apk located directly under a release directory
          # Priority 2: app-release-unsigned.apk located directly under a release directory
          # Priority 3: any APK located under a release/ directory
          # Priority 4: single candidate fallback
          PRIMARY_APK=""

          for apk in "${CANDIDATES[@]}"; do
            if [[ "$apk" =~ /release/app-release\.apk$ ]]; then
              PRIMARY_APK="$apk"
              echo "Selected signed release APK: $PRIMARY_APK"
              break
            fi
          done

          if [ -z "$PRIMARY_APK" ]; then
            for apk in "${CANDIDATES[@]}"; do
              if [[ "$apk" =~ /release/app-release-unsigned\.apk$ ]]; then
                PRIMARY_APK="$apk"
                echo "Selected unsigned release APK: $PRIMARY_APK"
                break
              fi
            done
          fi

          if [ -z "$PRIMARY_APK" ]; then
            for apk in "${CANDIDATES[@]}"; do
              if [[ "$apk" =~ /release/ ]]; then
                PRIMARY_APK="$apk"
                echo "Selected release APK in release directory: $PRIMARY_APK"
                break
              fi
            done
          fi

          if [ -z "$PRIMARY_APK" ] && [ "${#CANDIDATES[@]}" -eq 1 ]; then
            PRIMARY_APK="${CANDIDATES[0]}"
            echo "Selected single discovered candidate: $PRIMARY_APK"
          fi

          if [ -z "$PRIMARY_APK" ]; then
            echo "ERROR: Ambiguous candidate selection among: ${CANDIDATES[*]}"
            exit 1
          fi

          # Verify that selected APK exists, has .apk extension, and is non-empty
          if [ ! -f "$PRIMARY_APK" ]; then
            echo "ERROR: Selected APK does not exist: $PRIMARY_APK"
            exit 1
          fi

          if [[ "$PRIMARY_APK" != *.apk ]]; then
            echo "ERROR: Selected file does not have .apk extension: $PRIMARY_APK"
            exit 1
          fi

          APK_BYTES="$(stat -c "%s" "$PRIMARY_APK")"
          if [ "$APK_BYTES" -le 0 ]; then
            echo "ERROR: Selected APK is empty (0 bytes): $PRIMARY_APK"
            exit 1
          fi

          echo "Validating APK integrity with unzip..."
          unzip -t "$PRIMARY_APK" >/dev/null 2>&1 || {
            echo "ERROR: Selected APK failed ZIP archive validation (unzip -t)!"
            exit 1
          }

          APK_RAW_SHA256="$(sha256sum "$PRIMARY_APK" | awk '{print $1}')"

          echo "========================================"
          echo "APK source:      $PRIMARY_APK"
          echo "APK size:        $APK_BYTES"
          echo "APK SHA256:      $APK_RAW_SHA256"
          echo "APK integrity:   PASS"
          echo "========================================"

          ASSET_NAME="app-release.apk"
          CHECKSUM_NAME="app-release.apk.sha256"

          # Copy without modifying contents
          cp "$PRIMARY_APK" "$ASSET_NAME"

          if [ ! -s "$ASSET_NAME" ]; then
            echo "ERROR: Packaged asset '$ASSET_NAME' is empty."
            exit 1
          fi

          # Validate copied asset integrity
          unzip -t "$ASSET_NAME" >/dev/null 2>&1 || {
            echo "ERROR: Copied asset '$ASSET_NAME' failed ZIP validation!"
            exit 1
          }

          sha256sum "$ASSET_NAME" > "$CHECKSUM_NAME"
          SHA256_HASH="$(awk '{print $1}' "$CHECKSUM_NAME")"

          if [ "$SHA256_HASH" != "$APK_RAW_SHA256" ]; then
            echo "ERROR: Copied asset checksum mismatch!"
            exit 1
          fi

          echo "========================================"
          echo "Release Assets Prepared:"
          echo " - APK:      $ASSET_NAME ($APK_BYTES bytes)"
          echo " - Checksum: $CHECKSUM_NAME ($(cat "$CHECKSUM_NAME"))"
          echo "========================================"

          echo "APK_ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET_NAME=$CHECKSUM_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$SHA256_HASH" >> "$GITHUB_ENV"

      - name: Upload Release Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "Equilizer-Release-${{ env.RELEASE_TAG }}"
          path: |
            ${{ env.APK_ASSET_NAME }}
            ${{ env.CHECKSUM_ASSET_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REPO="${GITHUB_REPOSITORY:-Obito-uchiha12/Equilizer}"
          echo "Target Repository: $TARGET_REPO"
          echo "Publishing GitHub Release: $RELEASE_TAG"

          # 1. Check if release exists or create it
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists on $TARGET_REPO."
            RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json id,tagName,url,assets)"
          else
            echo "Release '$RELEASE_TAG' does not exist on $TARGET_REPO. Creating new release targeting $GITHUB_SHA..."
            gh release create "$RELEASE_TAG" \
              --repo "$TARGET_REPO" \
              --title "Equalizer $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest
            RELEASE_JSON="$(gh release view "$RELEASE_TAG" --repo "$TARGET_REPO" --json id,tagName,url,assets)"
          fi

          RELEASE_ID="$(echo "$RELEASE_JSON" | jq -r '.id')"
          echo "Release ID: $RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
          echo "TARGET_REPO=$TARGET_REPO" >> "$GITHUB_ENV"

          # 2. Upload APK and SHA256 checksum with --clobber
          echo "Uploading assets ($APK_ASSET_NAME, $CHECKSUM_ASSET_NAME) to release '$RELEASE_TAG' on $TARGET_REPO..."
          gh release upload "$RELEASE_TAG" \
            "$APK_ASSET_NAME" \
            "$CHECKSUM_ASSET_NAME" \
            --repo "$TARGET_REPO" \
            --clobber

      - name: Query Remote Release Assets and Verify Download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TARGET_REPO="${TARGET_REPO:-${GITHUB_REPOSITORY:-Obito-uchiha12/Equilizer}}"
          echo "=== Fetching Remote Release State from GitHub REST API ==="

          # Query release asset metadata directly via GitHub API
          RELEASE_INFO="$(gh api "repos/${TARGET_REPO}/releases/tags/${RELEASE_TAG}")"
          RELEASE_ID="$(echo "$RELEASE_INFO" | jq -r '.id')"
          RELEASE_HTML_URL="$(echo "$RELEASE_INFO" | jq -r '.html_url')"

          ASSETS_JSON="$(gh api "repos/${TARGET_REPO}/releases/${RELEASE_ID}/assets")"
          echo "Remote Assets JSON:"
          echo "$ASSETS_JSON" | jq -r '.[] | {id: .id, name: .name, size: .size, state: .state, browser_download_url: .browser_download_url}'

          # Verify APK Asset presence & metadata
          APK_ASSET_DATA="$(echo "$ASSETS_JSON" | jq -r --arg name "$APK_ASSET_NAME" '.[] | select(.name == $name)')"
          if [ -z "$APK_ASSET_DATA" ]; then
            echo "ERROR: Remote APK asset '$APK_ASSET_NAME' was not found in release $RELEASE_TAG on $TARGET_REPO!"
            exit 1
          fi

          APK_ASSET_ID="$(echo "$APK_ASSET_DATA" | jq -r '.id')"
          APK_ASSET_SIZE="$(echo "$APK_ASSET_DATA" | jq -r '.size')"
          APK_ASSET_STATE="$(echo "$APK_ASSET_DATA" | jq -r '.state')"
          APK_DOWNLOAD_URL="$(echo "$APK_ASSET_DATA" | jq -r '.browser_download_url')"

          if [ "$APK_ASSET_STATE" != "uploaded" ]; then
            echo "ERROR: Remote APK asset state is '$APK_ASSET_STATE', expected 'uploaded'!"
            exit 1
          fi

          if [ "$APK_ASSET_SIZE" -le 0 ]; then
            echo "ERROR: Remote APK asset size is $APK_ASSET_SIZE bytes (must be > 0)!"
            exit 1
          fi

          # Verify Checksum Asset presence & metadata
          SHA256_ASSET_DATA="$(echo "$ASSETS_JSON" | jq -r --arg name "$CHECKSUM_ASSET_NAME" '.[] | select(.name == $name)')"
          if [ -z "$SHA256_ASSET_DATA" ]; then
            echo "ERROR: Remote checksum asset '$CHECKSUM_ASSET_NAME' was not found in release $RELEASE_TAG!"
            exit 1
          fi

          SHA256_ASSET_ID="$(echo "$SHA256_ASSET_DATA" | jq -r '.id')"
          SHA256_DOWNLOAD_URL="$(echo "$SHA256_ASSET_DATA" | jq -r '.browser_download_url')"

          echo "APK Asset ID: $APK_ASSET_ID ($APK_ASSET_SIZE bytes)"
          echo "APK Download URL: $APK_DOWNLOAD_URL"
          echo "SHA256 Asset ID: $SHA256_ASSET_ID"
          echo "SHA256 Download URL: $SHA256_DOWNLOAD_URL"

          # Remote Download & Integrity Verification
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          DOWNLOADED_APK="${VERIFY_DIR}/${APK_ASSET_NAME}"
          DOWNLOADED_SHA256="${VERIFY_DIR}/${CHECKSUM_ASSET_NAME}"

          echo "Downloading remote APK from: $APK_DOWNLOAD_URL"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$APK_DOWNLOAD_URL" -o "$DOWNLOADED_APK"

          if [ ! -s "$DOWNLOADED_APK" ]; then
            echo "ERROR: Downloaded remote APK is empty or failed to download."
            exit 1
          fi

          echo "Validating downloaded APK structure with unzip..."
          unzip -t "$DOWNLOADED_APK" >/dev/null 2>&1 || {
            echo "ERROR: Downloaded remote APK failed ZIP archive validation!"
            exit 1
          }

          DOWNLOADED_HASH="$(sha256sum "$DOWNLOADED_APK" | awk '{print $1}')"
          echo "Local SHA256:             $RELEASE_SHA256"
          echo "Downloaded Remote SHA256: $DOWNLOADED_HASH"

          if [ "$RELEASE_SHA256" != "$DOWNLOADED_HASH" ]; then
            echo "ERROR: SHA256 mismatch between local build ($RELEASE_SHA256) and remote download ($DOWNLOADED_HASH)!"
            exit 1
          fi

          echo "Downloading remote SHA256 checksum file..."
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$SHA256_DOWNLOAD_URL" -o "$DOWNLOADED_SHA256"

          DOWNLOADED_CHECKSUM_CONTENT="$(cat "$DOWNLOADED_SHA256" | awk '{print $1}')"
          if [ "$DOWNLOADED_CHECKSUM_CONTENT" != "$RELEASE_SHA256" ]; then
            echo "ERROR: Remote SHA256 file content ($DOWNLOADED_CHECKSUM_CONTENT) does not match expected ($RELEASE_SHA256)!"
            exit 1
          fi

          echo "RELEASE_HTML_URL=$RELEASE_HTML_URL" >> "$GITHUB_ENV"
          echo "RELEASE_URL=$RELEASE_HTML_URL" >> "$GITHUB_ENV"
          echo "REMOTE_APK_ASSET_ID=$APK_ASSET_ID" >> "$GITHUB_ENV"
          echo "REMOTE_APK_URL=$APK_DOWNLOAD_URL" >> "$GITHUB_ENV"
          echo "REMOTE_APK_SIZE=$APK_ASSET_SIZE" >> "$GITHUB_ENV"

          echo "========================================"
          echo "GITHUB RELEASE VERIFICATION"
          echo "========================================"
          echo "Repository:             $TARGET_REPO"
          echo "Release:                $RELEASE_TAG"
          echo "Release ID:             $RELEASE_ID"
          echo "Remote APK:             $APK_ASSET_NAME"
          echo "Remote APK Asset ID:    $APK_ASSET_ID"
          echo "Remote APK Size:        $APK_ASSET_SIZE bytes"
          echo "Remote APK URL:         $APK_DOWNLOAD_URL"
          echo "Remote SHA256:          $CHECKSUM_ASSET_NAME"
          echo "Local SHA256:           $RELEASE_SHA256"
          echo "Downloaded Remote SHA256: $DOWNLOADED_HASH"
          echo "APK ASSET PRESENT:      true"
          echo "APK DOWNLOAD TEST:      PASS"
          echo "APK HASH MATCH:         PASS"
          echo "SHA256 ASSET PRESENT:   true"
          echo "SHA256 CONTENT MATCH:   PASS"
          echo "FINAL RELEASE VERIFICATION: PASS"
          echo "========================================"

      - name: Secure Cleanup of Temporary Signing Files
        if: always()
        shell: bash
        run: |
          if [ -f "app/release.keystore" ]; then
            shred -u app/release.keystore || rm -f app/release.keystore
          fi

      - name: Print Release Summary
        shell: bash
        run: |
          echo "=================================================="
          echo "GitHub Release Published and Verified Successfully"
          echo "=================================================="
          echo "Release Tag:     $RELEASE_TAG"
          echo "APK Asset:       $APK_ASSET_NAME"
          echo "APK Size:        $(ls -lh "$APK_ASSET_NAME" | awk '{print $5}')"
          echo "SHA256:          $RELEASE_SHA256"
          echo "Release URL:     $RELEASE_URL"
          echo "=================================================="
