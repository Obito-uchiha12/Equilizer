name: Build and Publish Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Environment & Wrapper Diagnostics
        run: |
          echo "=== Release Environment Diagnostics ==="
          echo "Current Working Directory: $(pwd)"
          echo "Event Name: ${{ github.event_name }}"
          echo "Git Ref: ${{ github.ref }}"
          echo "Git Ref Name: ${{ github.ref_name }}"
          chmod +x ./gradlew
          test -f ./gradlew
          ./gradlew --version

      - name: Determine and Validate Release Tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          # Trim whitespace
          TAG=$(echo "$TAG" | xargs)

          if [ -z "$TAG" ]; then
            echo "ERROR: Release tag cannot be empty."
            exit 1
          fi

          # Validate that tag starts with 'v' and follows semantic versioning
          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9\.\+]+)?$ ]]; then
            echo "ERROR: Invalid release tag '$TAG'. Must start with 'v' and follow semantic versioning (e.g., v1.0.0, v1.0.1-beta.1)."
            exit 1
          fi

          echo "Validated Release Tag: $TAG"
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Restore Keystore from Secrets (If Configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release signing keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No external release keystore secret configured; continuing with standard release build."
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Locate, Verify, and Package Release Binary
        id: package_release
        run: |
          set -euo pipefail

          echo "Locating Release APK in app/build/outputs/apk/release/..."
          APK_FILES=()
          while IFS= read -r file; do
            APK_FILES+=("$file")
          done < <(find app/build/outputs/apk/release -maxdepth 2 -type f -name "*.apk" | sort)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "ERROR: No release APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          # Prioritize app-release.apk if signed, otherwise use the first discovered release APK
          PRIMARY_APK=""
          for apk in "${APK_FILES[@]}"; do
            if [[ "$(basename "$apk")" == "app-release.apk" ]]; then
              PRIMARY_APK="$apk"
              break
            fi
          done
          if [ -z "$PRIMARY_APK" ]; then
            PRIMARY_APK="${APK_FILES[0]}"
          fi

          if [ ! -s "$PRIMARY_APK" ]; then
            echo "ERROR: Release APK '$PRIMARY_APK' is empty (0 bytes)!"
            exit 1
          fi

          echo "Found Release APK: $PRIMARY_APK ($(ls -lh "$PRIMARY_APK" | awk '{print $5}'))"

          ASSET_NAME="Equilizer-${RELEASE_TAG}.apk"
          cp "$PRIMARY_APK" "$ASSET_NAME"

          # Generate SHA-256 Checksum
          sha256sum "$ASSET_NAME" | tee "${ASSET_NAME}.sha256"
          SHA256_HASH=$(awk '{print $1}' "${ASSET_NAME}.sha256")

          echo "APK_ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "CHECKSUM_ASSET_NAME=${ASSET_NAME}.sha256" >> "$GITHUB_ENV"
          echo "RELEASE_SHA256=$SHA256_HASH" >> "$GITHUB_ENV"
          echo "Release asset prepared: $ASSET_NAME (SHA-256: $SHA256_HASH)"

      - name: Secure Cleanup of Temporary Signing Files
        if: always()
        run: |
          if [ -f "app/release.keystore" ]; then
            shred -u app/release.keystore || rm -f app/release.keystore
          fi

      - name: Upload Release Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Equilizer-Release-${{ env.RELEASE_TAG }}
          path: |
            ${{ env.APK_ASSET_NAME }}
            ${{ env.CHECKSUM_ASSET_NAME }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Publishing release '${RELEASE_TAG}' to GitHub Releases..."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists. Uploading/updating release assets with --clobber..."
            gh release upload "$RELEASE_TAG" "$APK_ASSET_NAME" "$CHECKSUM_ASSET_NAME" --clobber
          else
            echo "Release '$RELEASE_TAG' does not exist. Creating new GitHub Release with commit target $GITHUB_SHA..."
            gh release create "$RELEASE_TAG" \
              "$APK_ASSET_NAME" \
              "$CHECKSUM_ASSET_NAME" \
              --title "Equilizer $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --latest
          fi

      - name: Verify GitHub Release Asset Attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Verifying attached assets on GitHub Release '$RELEASE_TAG'..."

          RELEASE_JSON=$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets,url)
          echo "Release Metadata: $RELEASE_JSON"

          ASSET_NAMES=$(echo "$RELEASE_JSON" | jq -r '.assets[].name')
          echo "Discovered Release Assets:"
          echo "$ASSET_NAMES"

          if ! echo "$ASSET_NAMES" | grep -Fxq "$APK_ASSET_NAME"; then
            echo "ERROR: Required APK asset '$APK_ASSET_NAME' is NOT attached to release '$RELEASE_TAG'!"
            exit 1
          fi

          if ! echo "$ASSET_NAMES" | grep -Fxq "$CHECKSUM_ASSET_NAME"; then
            echo "ERROR: Required checksum asset '$CHECKSUM_ASSET_NAME' is NOT attached to release '$RELEASE_TAG'!"
            exit 1
          fi

          RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.url')
          echo "RELEASE_URL=$RELEASE_URL" >> "$GITHUB_ENV"
          echo "Release asset verification successful!"

      - name: Print Release Summary
        run: |
          echo "=================================================="
          echo "🎉 GitHub Release Published & Verified Successfully"
          echo "=================================================="
          echo "Release Tag:     ${{ env.RELEASE_TAG }}"
          echo "APK Asset:       ${{ env.APK_ASSET_NAME }}"
          echo "APK Size:        $(ls -lh "${{ env.APK_ASSET_NAME }}" | awk '{print $5}')"
          echo "SHA256:          ${{ env.RELEASE_SHA256 }}"
          echo "Release URL:     ${{ env.RELEASE_URL }}"
          echo "=================================================="

